name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'feature-*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Print Java version
        run: java -version

      - name: Build and test
        run: ./mvnw -B clean verify
